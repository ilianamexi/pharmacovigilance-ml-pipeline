name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  analysis:
    # Downloads a 12-month FAERS sample and runs the full analysis: start it from the Actions tab,
    # or put [run-analysis] in the commit message. Results are committed back to the branch.
    needs: tests
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-analysis]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Download FAERS reports (500 per month, 2023)
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
        run: python run_pipeline.py fetch --start 20230101 --end 20231231 --per-month 500
      - run: python -W ignore run_pipeline.py run
      - name: Commit data and results to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faers_reports.jsonl.gz results figures
          git commit -m "Add FAERS sample and results from CI run ${{ github.run_id }}" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
